<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="rim" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="55%" stop-color="#ebe3d4"/>
      <stop offset="100%" stop-color="#cfc4b4"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#f8f4ea"/>
      <stop offset="70%" stop-color="#ebe4d6"/>
      <stop offset="100%" stop-color="#ddd5c8"/>
    </radialGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
  <!-- plate rim, top view -->
  <circle cx="256" cy="256" r="228" fill="url(#rim)" stroke="#b8ab98" stroke-width="3"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#fffef8" stroke-width="1.5" opacity=".65"/>
  <circle cx="256" cy="256" r="168" fill="url(#well)" stroke="#d5ccb8" stroke-width="2"/>
  <ellipse cx="256" cy="220" rx="72" ry="20" fill="#fff" opacity=".22"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(90,75,58,.12)" stroke-width="1" stroke-dasharray="6 10"/>
  </g>
</svg>
